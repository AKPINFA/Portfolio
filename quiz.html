<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Mythologie — Édition Pro</title>
<style>
  :root{
    --bg-1:#0f0c1d;
    --bg-2:#1b1436;
    --card:#1e1a3a;
    --card-border:#332a5c;
    --gold:#f1c40f;
    --gold-soft:rgba(241,196,15,0.12);
    --green:#2ecc71;
    --red:#e74c3c;
    --text:#f4f2ff;
    --text-soft:#a79fcf;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg-2), var(--bg-1) 60%);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .container{
    max-width:640px; width:100%;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:36px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    position:relative;
    overflow:hidden;
  }
  .container::before{
    content:""; position:absolute; top:-60px; right:-60px;
    width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, var(--gold-soft), transparent 70%);
  }

  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; position:relative; z-index:1;}
  h1{ font-size:22px; margin:0; color:var(--gold); letter-spacing:0.02em;}
  .streak{
    display:flex; align-items:center; gap:6px;
    background:var(--gold-soft); color:var(--gold);
    padding:6px 12px; border-radius:999px; font-size:13px; font-weight:700;
  }

  .meta-row{ display:flex; justify-content:space-between; align-items:center; margin:18px 0 8px; font-size:13px; color:var(--text-soft);}
  .progress-track{
    height:8px; background:#2a234a; border-radius:999px; overflow:hidden; margin-bottom:22px;
  }
  .progress-fill{
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,#f1c40f,#f39c12);
    transition:width .35s ease;
  }

  .timer-wrap{ display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .timer-track{ flex:1; height:6px; background:#2a234a; border-radius:999px; overflow:hidden;}
  .timer-fill{ height:100%; width:100%; background:linear-gradient(90deg,#2ecc71,#27ae60); transition:width 1s linear, background .3s ease;}
  .timer-label{ font-size:12px; color:var(--text-soft); min-width:34px; text-align:right;}

  .question{ font-size:21px; font-weight:600; line-height:1.4; margin-bottom:22px; min-height:58px;}

  .options{ display:flex; flex-direction:column; gap:12px; margin-bottom:8px;}
  .option{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; border-radius:12px; border:1.5px solid var(--card-border);
    background:#241d47; color:var(--text);
    font-size:15.5px; text-align:left; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled){ transform:translateX(4px); border-color:var(--gold); }
  .option .letter{
    width:26px; height:26px; border-radius:8px; background:#332a5c;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:700; color:var(--text-soft); flex-shrink:0;
  }
  .option.correct{ background:rgba(46,204,113,0.16); border-color:var(--green); }
  .option.correct .letter{ background:var(--green); color:#08331b; }
  .option.wrong{ background:rgba(231,76,60,0.16); border-color:var(--red); }
  .option.wrong .letter{ background:var(--red); color:#3a0d0a; }
  .option:disabled{ cursor:default; }

  .feedback{
    font-size:13.5px; font-weight:600; margin:4px 0 18px; min-height:18px;
  }
  .feedback.good{ color:var(--green); }
  .feedback.bad{ color:var(--red); }

  #next-btn{
    width:100%; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(90deg,#f1c40f,#f39c12); color:#241a00;
    font-size:15.5px; font-weight:700; cursor:pointer; display:none;
    transition:transform .15s ease;
  }
  #next-btn:hover{ transform:translateY(-2px); }

  .result{ display:none; text-align:center; }
  .result-emoji{ font-size:54px; margin-bottom:6px; }
  .result-title{ font-size:24px; font-weight:700; color:var(--gold); margin-bottom:6px; }
  .result-sub{ color:var(--text-soft); font-size:14.5px; margin-bottom:22px; }
  .result-stats{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:26px;
  }
  .stat-box{ background:#241d47; border:1px solid var(--card-border); border-radius:12px; padding:14px 8px; }
  .stat-value{ font-size:22px; font-weight:700; color:var(--gold); }
  .stat-label{ font-size:11.5px; color:var(--text-soft); margin-top:2px; text-transform:uppercase; letter-spacing:0.04em;}

  @media (max-width:480px){
    .container{ padding:26px 20px; }
    .question{ font-size:18px; }
  }
</style>
</head>
<body>

<div class="container">

  <div id="quiz-view">
    <div class="top-row">
      <h1>⚡ Quiz Mythologie</h1>
      <div class="streak">🔥 <span id="streak-count">0</span></div>
    </div>

    <div class="meta-row">
      <span id="question-counter">Question 1 / 30</span>
      <span id="score-live">Score : 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="timer-wrap">
      <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
      <span class="timer-label" id="timer-label">15s</span>
    </div>

    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>

    <button id="next-btn">Question suivante →</button>
  </div>

  <div class="result" id="result-view">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <div class="result-title" id="result-title">Excellent !</div>
    <div class="result-sub" id="result-sub">Tu maîtrises la mythologie sur le bout des doigts.</div>
    <div class="result-stats">
      <div class="stat-box"><div class="stat-value" id="stat-score">0/30</div><div class="stat-label">Score</div></div>
      <div class="stat-box"><div class="stat-value" id="stat-percent">0%</div><div class="stat-label">Réussite</div></div>
      <div class="stat-box"><div class="stat-value" id="stat-streak">0</div><div class="stat-label">Meilleure série</div></div>
    </div>
    <button id="restart-btn" style="width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#f1c40f,#f39c12);color:#241a00;font-size:15.5px;font-weight:700;cursor:pointer;">🔄 Rejouer</button>
  </div>

</div>

<script>
  const questions = [
    { question: "Qui est le dieu grec de la mer ?", options: ["Zeus", "Hadès", "Poséidon", "Apollon"], answer: 2 },
    { question: "Dans la mythologie romaine, Jupiter correspond à quel dieu grec ?", options: ["Hadès", "Zeus", "Arès", "Hermès"], answer: 1 },
    { question: "Qui est la déesse grecque de la sagesse ?", options: ["Héra", "Aphrodite", "Athéna", "Artémis"], answer: 2 },
    { question: "Quel héros a tué le Minotaure ?", options: ["Achille", "Thésée", "Héraclès", "Persée"], answer: 1 },
    { question: "Comment s'appelle le royaume des morts dans la mythologie grecque ?", options: ["L'Olympe", "Les Champs Élysées", "L'Hadès", "Tartare"], answer: 2 },
    { question: "Qui est le messager des dieux dans la mythologie grecque ?", options: ["Hermès", "Apollon", "Dionysos", "Arès"], answer: 0 },
    { question: "Quelle déesse est née de l'écume de la mer ?", options: ["Aphrodite", "Artémis", "Héra", "Gaïa"], answer: 0 },
    { question: "Qui a volé le feu sacré aux dieux pour le donner aux hommes ?", options: ["Prométhée", "Héraclès", "Orphée", "Persée"], answer: 0 },
    { question: "Comment s'appelle le dieu romain de la guerre ?", options: ["Mars", "Pluton", "Mercure", "Janus"], answer: 0 },
    { question: "Qui est le frère de Zeus et maître des Enfers ?", options: ["Apollon", "Hadès", "Poséidon", "Cronos"], answer: 1 },
    { question: "Quel héros grec est connu pour sa force et ses douze travaux ?", options: ["Héraclès", "Thésée", "Jason", "Achille"], answer: 0 },
    { question: "Quelle créature est mi-femme, mi-oiseau, et attire les marins par son chant ?", options: ["Méduse", "Sirène", "Sphinx", "Harpie"], answer: 1 },
    { question: "Quelle est la boisson divine des dieux de l'Olympe ?", options: ["Ambroisie", "Nectar", "Hydromel", "Vin"], answer: 1 },
    { question: "Qui est le dieu grec du vin et de la fête ?", options: ["Dionysos", "Apollon", "Hermès", "Arès"], answer: 0 },
    { question: "Quel titan fut condamné à porter le ciel sur ses épaules ?", options: ["Cronos", "Atlas", "Océan", "Hypérion"], answer: 1 },
    { question: "Qui est la déesse grecque de la chasse et de la lune ?", options: ["Athéna", "Artémis", "Héra", "Séléné"], answer: 1 },
    { question: "Quel dieu romain est associé à l'amour et au désir ?", options: ["Cupidon", "Mars", "Bacchus", "Janus"], answer: 0 },
    { question: "Comment s'appelle le fleuve que les morts devaient traverser pour rejoindre les Enfers ?", options: ["Tartare", "Styx", "Lethe", "Achéron"], answer: 1 },
    { question: "Qui est la mère de Zeus, Poséidon et Hadès ?", options: ["Gaïa", "Rhéa", "Héra", "Nyx"], answer: 1 },
    { question: "Quel héros a affronté la Méduse et tranché sa tête ?", options: ["Persée", "Thésée", "Achille", "Ulysse"], answer: 0 },
    { question: "Quel est le nom latin d'Hadès dans la mythologie romaine ?", options: ["Pluton", "Janus", "Mercure", "Saturne"], answer: 0 },
    { question: "Quel dieu grec est associé à la musique, la poésie et le soleil ?", options: ["Apollon", "Hermès", "Arès", "Dionysos"], answer: 0 },
    { question: "Quelle créature garde les Enfers selon la mythologie grecque ?", options: ["Cerbère", "Hydre", "Chimère", "Sphinx"], answer: 0 },
    { question: "Qui est le roi des Titans, père de Zeus, Hadès et Poséidon ?", options: ["Cronos", "Ouranos", "Atlas", "Océan"], answer: 0 },
    { question: "Qui a conçu le labyrinthe pour enfermer le Minotaure ?", options: ["Dédale", "Thésée", "Icare", "Orphée"], answer: 0 },
    { question: "Quelle déesse romaine correspond à la déesse grecque Héra ?", options: ["Junon", "Vénus", "Minerve", "Diane"], answer: 0 },
    { question: "Quel héros grec est resté invulnérable sauf au talon ?", options: ["Héraclès", "Achille", "Jason", "Ménélas"], answer: 1 },
    { question: "Quelle muse inspire la poésie épique ?", options: ["Calliope", "Clio", "Érato", "Terpsichore"], answer: 0 },
    { question: "Quelle créature mythologique avait 9 têtes et repoussait quand on les coupait ?", options: ["Hydre de Lerne", "Chimère", "Cerbère", "Méduse"], answer: 0 },
    { question: "Quel dieu romain correspond à Hermès dans la mythologie grecque ?", options: ["Mercure", "Mars", "Pluton", "Bacchus"], answer: 0 },
    { question: "Quel géant aux cent bras aida Zeus contre les Titans ?", options: ["Briarée", "Typhon", "Encelade", "Atlas"], answer: 0 },
    { question: "Qui est la déesse grecque de la terre nourricière ?", options: ["Déméter", "Gaïa", "Perséphone", "Rhéa"], answer: 0 },
    { question: "Quel dieu égyptien a une tête de chacal et guide les morts ?", options: ["Anubis", "Osiris", "Horus", "Thot"], answer: 0 },
    { question: "Dans la mythologie nordique, qui est le dieu du tonnerre ?", options: ["Odin", "Thor", "Loki", "Baldr"], answer: 1 },
    { question: "Comment s'appelle le marteau de Thor ?", options: ["Gungnir", "Mjöllnir", "Gram", "Draupnir"], answer: 1 },
    { question: "Qui est le père des dieux dans la mythologie nordique ?", options: ["Odin", "Thor", "Freyr", "Tyr"], answer: 0 },
    { question: "Quel serpent encercle le monde dans la mythologie nordique ?", options: ["Jörmungand", "Nidhogg", "Fafnir", "Ouroboros"], answer: 0 },
    { question: "Qui a épousé Perséphone et l'a emmenée aux Enfers ?", options: ["Hadès", "Zeus", "Poséidon", "Arès"], answer: 0 },
    { question: "Quelle est la demeure des dieux grecs ?", options: ["L'Olympe", "Le Tartare", "L'Élysée", "L'Achéron"], answer: 0 },
    { question: "Qui a tué la Chimère ?", options: ["Bellérophon", "Persée", "Thésée", "Jason"], answer: 0 },
  ];

  const TEMPS_PAR_QUESTION = 15; // secondes

  const els = {
    quizView: document.getElementById("quiz-view"),
    resultView: document.getElementById("result-view"),
    question: document.getElementById("question"),
    options: document.getElementById("options"),
    feedback: document.getElementById("feedback"),
    nextBtn: document.getElementById("next-btn"),
    restartBtn: document.getElementById("restart-btn"),
    counter: document.getElementById("question-counter"),
    scoreLive: document.getElementById("score-live"),
    progressFill: document.getElementById("progress-fill"),
    timerFill: document.getElementById("timer-fill"),
    timerLabel: document.getElementById("timer-label"),
    streakCount: document.getElementById("streak-count"),
    statScore: document.getElementById("stat-score"),
    statPercent: document.getElementById("stat-percent"),
    statStreak: document.getElementById("stat-streak"),
    resultEmoji: document.getElementById("result-emoji"),
    resultTitle: document.getElementById("result-title"),
    resultSub: document.getElementById("result-sub"),
  };

  let currentIndex = 0;
  let score = 0;
  let streak = 0;
  let bestStreak = 0;
  let timerInterval = null;
  let timeLeft = TEMPS_PAR_QUESTION;
  let answered = false;

  const LETTERS = ["A", "B", "C", "D"];

  function startQuiz() {
    currentIndex = 0;
    score = 0;
    streak = 0;
    bestStreak = 0;
    els.quizView.style.display = "block";
    els.resultView.style.display = "none";
    updateScoreLive();
    updateStreak();
    showQuestion();
  }

  function showQuestion() {
    answered = false;
    els.feedback.textContent = "";
    els.feedback.className = "feedback";
    els.nextBtn.style.display = "none";
    els.options.innerHTML = "";

    const q = questions[currentIndex];
    els.question.textContent = q.question;
    els.counter.textContent = `Question ${currentIndex + 1} / ${questions.length}`;
    els.progressFill.style.width = `${(currentIndex / questions.length) * 100}%`;

    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${opt}</span>`;
      btn.addEventListener("click", () => selectAnswer(i));
      els.options.appendChild(btn);
    });

    startTimer();
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = TEMPS_PAR_QUESTION;
    els.timerFill.style.width = "100%";
    els.timerFill.style.background = "linear-gradient(90deg,#2ecc71,#27ae60)";
    els.timerLabel.textContent = `${timeLeft}s`;

    timerInterval = setInterval(() => {
      timeLeft--;
      const pct = (timeLeft / TEMPS_PAR_QUESTION) * 100;
      els.timerFill.style.width = `${Math.max(pct, 0)}%`;
      els.timerLabel.textContent = `${Math.max(timeLeft, 0)}s`;

      if (timeLeft <= 5) els.timerFill.style.background = "linear-gradient(90deg,#e74c3c,#c0392b)";

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        if (!answered) selectAnswer(-1); // temps écoulé = mauvaise réponse
      }
    }, 1000);
  }

  function selectAnswer(selectedIndex) {
    if (answered) return;
    answered = true;
    clearInterval(timerInterval);

    const q = questions[currentIndex];
    const buttons = document.querySelectorAll(".option");

    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add("correct");
      else if (i === selectedIndex) btn.classList.add("wrong");
    });

    if (selectedIndex === q.answer) {
      score++;
      streak++;
      bestStreak = Math.max(bestStreak, streak);
      els.feedback.textContent = "✓ Bonne réponse !";
      els.feedback.classList.add("good");
    } else {
      streak = 0;
      els.feedback.textContent = selectedIndex === -1 ? "⏱ Temps écoulé !" : "✗ Mauvaise réponse.";
      els.feedback.classList.add("bad");
    }

    updateScoreLive();
    updateStreak();
    els.nextBtn.style.display = "block";
    els.nextBtn.textContent = currentIndex + 1 < questions.length ? "Question suivante →" : "Voir le résultat →";
  }

  function updateScoreLive() {
    els.scoreLive.textContent = `Score : ${score}`;
  }

  function updateStreak() {
    els.streakCount.textContent = streak;
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    clearInterval(timerInterval);
    els.progressFill.style.width = "100%";
    els.quizView.style.display = "none";
    els.resultView.style.display = "block";

    const percent = Math.round((score / questions.length) * 100);
    els.statScore.textContent = `${score}/${questions.length}`;
    els.statPercent.textContent = `${percent}%`;
    els.statStreak.textContent = bestStreak;

    if (percent >= 90) {
      els.resultEmoji.textContent = "🏆";
      els.resultTitle.textContent = "Maître de l'Olympe !";
      els.resultSub.textContent = "Score exceptionnel — tu connais la mythologie mieux que la plupart des mortels.";
    } else if (percent >= 70) {
      els.resultEmoji.textContent = "⭐";
      els.resultTitle.textContent = "Très bon niveau !";
      els.resultSub.textContent = "Tu maîtrises bien tes classiques, encore un effort pour l'excellence.";
    } else if (percent >= 50) {
      els.resultEmoji.textContent = "📘";
      els.resultTitle.textContent = "Pas mal !";
      els.resultSub.textContent = "Une bonne base, mais quelques légendes t'échappent encore.";
    } else {
      els.resultEmoji.textContent = "🌱";
      els.resultTitle.textContent = "Encore un peu d'entraînement !";
      els.resultSub.textContent = "Les dieux de l'Olympe attendent que tu approfondisses tes connaissances.";
    }
  }

  els.nextBtn.addEventListener("click", nextQuestion);
  els.restartBtn.addEventListener("click", startQuiz);

  startQuiz();
</script>
</body>
</html>
